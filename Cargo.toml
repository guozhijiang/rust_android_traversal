[package]
name = "atraverse"
version = "0.1.0"
edition = "2021"
description = "Android 应用智能遍历工具 (Fastbot-like)：高覆盖遍历 + 操作步骤记录 + 截图标注 + crash/ANR 捕获"
license = "MIT"

[[bin]]
name = "atraverse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rand = "0.8"
chrono = "0.4"
ctrlc = "3.4"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
